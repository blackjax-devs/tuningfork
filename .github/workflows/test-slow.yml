# Slow tests — PR-gating workflow.
#
# `pytest -m slow -n auto` on Python 3.13. ~tens of min wall, 60-min timeout.
# Slow tests are JIT-compiled chain runs that gate recipe schema correctness.
# Enabled on PR trigger (2026-05-24) to catch integration regressions before merge.
# 60-min timeout caps runaway costs on infrastructure; most test-slow runs finish
# in ~7-10 min on standard CI runners.
#
# CI uses -n auto (= 4 on standard GitHub-hosted Ubuntu runners) — half-wall vs -n 2.
# The Makefile uses -n 2 by design (agent-shell OOM concern, META-010) but
# CI jobs are isolated processes with 16 GB RAM, so -n auto is safe here.
#
# Excluded from CI by design (run locally as merge gate):
#   * -m e2e                    multi-algo×model harness; tens of min/cell
#   * -m requires_posteriordb   external data cache not in CI runners
#   * -m benchmark              opt-in perf benchmarks

name: test-slow

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-slow:
    name: test-slow
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --group bench

      - name: Pytest (slow marker)
        env:
          JAX_PLATFORM_NAME: cpu
        run: uv run pytest tests -m slow -n auto -q
