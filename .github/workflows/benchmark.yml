name: Recipe benchmark suite

# Nightly: fast + e2e benchmarks (all 33 cells, ~8 min fast + 2 slow e2e cells).
# Manual:  workflow_dispatch; suite=fast runs test_fast_recipes only (~8 min).
# No per-PR trigger: nightly + on-demand is the right model.
#
# Cell routing (by CI wall time from round-4 run):
#   test_fast_recipes.py: 31 cells ≤60s each → ~8 min total
#   test_e2e_recipes.py:   2 cells >60s each (lotka 204s, horseshoe 75s) → nightly only
#
# Working-directory note: the checkout IS the tuningfork repo root.

on:
  schedule:
    # Nightly at 02:00 UTC (off-peak; avoids contention with other CI)
    - cron: '0 2 * * *'
  # pull_request trigger intentionally omitted: the suite will grow to ~2h
  # (Tier 1+2 nightly), making per-PR CI untenable. Nightly + on-demand is
  # the right model — use workflow_dispatch for targeted pre-merge validation.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run (fast | e2e | all)'
        required: false
        default: 'all'

jobs:
  benchmark:
    name: Benchmark (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60   # hard cap: prevents hung CI slots

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          # Python is pinned via .python-version (repo root) + --python 3.13 on
          # every uv invocation below. setup-uv does not accept python-version
          # as an input; the pin is enforced by uv itself at sync/run time.

      - name: Install bench-perf deps
        # --python 3.13 forces uv to use 3.13 regardless of available interpreters.
        # .python-version in the repo root provides the same pin for local runs.
        run: uv sync --group bench-perf --python 3.13

      - name: Verify Python version
        # Fails the workflow if jax imports on the wrong Python (prevents silent 3.14 drift).
        run: |
          uv run --python 3.13 python --version
          uv run --python 3.13 python -c "import sys; assert sys.version_info[:2] == (3, 13), f'Expected Python 3.13, got {sys.version}'"

      - name: Select benchmark suite
        id: suite
        run: |
          if [ "${{ inputs.suite }}" = "fast" ]; then
            echo "files=benchmarks/test_fast_recipes.py" >> "$GITHUB_OUTPUT"
            echo "group=manual-fast" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.suite }}" = "e2e" ]; then
            echo "files=benchmarks/test_e2e_recipes.py" >> "$GITHUB_OUTPUT"
            echo "group=manual-e2e" >> "$GITHUB_OUTPUT"
          else
            # Nightly / manual 'all': fast + e2e
            echo "files=benchmarks/test_fast_recipes.py benchmarks/test_e2e_recipes.py" >> "$GITHUB_OUTPUT"
            echo "group=nightly-all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks
        # No working-directory: benchmarks/ is at the repo root.
        # --benchmark-max-time=0: each cell runs exactly once (1 round).
        # --benchmark-warmup=off: GT-gate validates correctness; warmup is redundant.
        run: |
          JAX_PLATFORM_NAME=cpu uv run --python 3.13 pytest ${{ steps.suite.outputs.files }} \
            -m benchmark \
            --benchmark-json=benchmark_results.json \
            --benchmark-disable-gc \
            --benchmark-warmup=off \
            --benchmark-min-rounds=1 \
            --benchmark-max-time=0 \
            -v

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}-${{ steps.filter.outputs.group }}
          # benchmark_results.json is written to the repo root (no working-directory).
          path: benchmark_results.json
          retention-days: 90

      # Trend tracking: compare against the most recent stored result on main.
      # Only on nightly schedule (not manual dispatch) to keep the trend baseline clean.
      - name: Store + compare benchmark trend (nightly only)
        if: github.event_name == 'schedule'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "tuningfork recipe benchmarks"
          tool: "pytest"
          output-file-path: benchmark_results.json
          # Push results to gh-pages branch for the trend dashboard
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Alert when performance regresses > 20% vs the rolling mean
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: false   # non-blocking: alert but don't fail the workflow
