name: Recipe benchmark suite

# Nightly: fast + e2e benchmarks (all 33 cells) with 3-seed cross-date regression.
# Manual:  workflow_dispatch; suite=fast runs test_fast_recipes only.
#
# Seed scheme: date-seeded (seed = int(YYYYMMDD)) for {date-1, date, date+1}.
# Overlapping seeds with prior night → cross-date regression detection.
#
# Runner: ubuntu-24.04 (pinned LTS — NOT ubuntu-latest which floats).
# Deps:   installed from uv.lock exactly; blackjax@main installed on top.
# Results: stored on benchmark-results branch (one <seed>.json per seed).
# Regression: _regression_check.py applies locked criterion (max_abs_mean_z≥4.0,
#   ESS-trend secondary), emits GH Actions annotations/step-fail.

on:
  schedule:
    # 22:00 UTC (not 02:00 UTC): GH delays scheduled runs 2.5-5h depending on
    # queue congestion (characterized 2026-06-01: blackjax "JAX Nightly" shows
    # consistent ~2.5-4h typical, ~5h on congested days).  22:00 UTC + 5h worst
    # + 1h run = 04:00 UTC = 06:00 CEST — just under the 6AM bar on bad days.
    # If nightly stops firing, push a dummy commit or use workflow_dispatch.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run (fast | e2e | all)'
        required: false
        default: 'all'
      seed_override:
        description: 'Override seed (int, e.g. 20260601); default = date-derived'
        required: false
        default: ''

permissions:
  contents: write   # needed to push to benchmark-results branch + create issues
  issues: write     # needed for auto-issue on REGRESSION verdict

jobs:
  benchmark:
    name: Benchmark (${{ github.event_name }})
    runs-on: ubuntu-24.04   # pinned LTS — float tags break env fingerprinting
    timeout-minutes: 180    # hard cap: 7 runs/cell (1 compile-warmup + 3x2) ~2.3x prior

    steps:
      - name: Checkout
        uses: actions/checkout@v5  # v5 uses Node 22 (v4 deprecated June 2025)
        with:
          # Fetch benchmark-results branch so load_prior_result() can find it
          fetch-depth: 0

      - name: Fetch benchmark-results branch
        run: git fetch origin benchmark-results:benchmark-results 2>/dev/null || true

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Restore JAX persistent compilation cache
        # MUST run BEFORE the install steps so hashFiles('uv.lock') reflects the
        # committed lockfile, NOT one mutated by "uv pip install blackjax@main".
        #
        # Bug history (#148 / fix PR): the cache step originally ran AFTER install.
        # "uv pip install git+...blackjax@main" pins a new blackjax commit and can
        # mutate uv.lock on disk; hashFiles('uv.lock') is evaluated at step-run
        # time, so the key changed nearly every run → guaranteed miss.
        #
        # Fix (original):
        #   1. Step moved here (pre-install) so hashFiles reads the committed lock.
        #   2. restore-keys uses a hash-INDEPENDENT prefix so a new primary key
        #      still restores the most-recent jax-compile cache entry (XLA artifacts
        #      are forward-compatible within a JAX minor version; worst case a small
        #      incremental recompile, not a cold 30-min rebuild).
        #
        # 2026-06-13 finding: actions/cache@v4 performs the cache SAVE in a
        # post-step. GitHub SKIPS post-steps when the job fails. This nightly has
        # been failing on a GT-correctness assertion since 2026-06-09, so the save
        # is skipped every night → the cache is never refreshed → run stays cold.
        # Observed: "Post Restore JAX persistent compilation cache → skipped" on
        # every failed nightly from 06-09 through 06-13 (4 consecutive nights).
        # The stale 06-04 blob (8 MB — implausibly small for a warm 34-cell cache)
        # is re-loaded each night via the restore-keys fallback, but never saved.
        #
        # Fix (2026-06-13): split into restore@v4 (this step) + save@v4 with
        # if: always() near the end of the job — mirrors the pattern that
        # speed_benchmark.yml already uses for its trend cache. The save key uses
        # github.run_id as a unique suffix so the save always writes a NEW entry
        # (cache-hit no-op is avoided). restore-keys picks up the most-recent
        # prior entry via the hash-prefix fallback below.
        #
        # JAX's persistent cache survives jax.clear_caches() (in-memory only).
        # Saves ~58 min/night on lotka_volterra + horseshoe e2e cells starting
        # night 2 (night 1 cold, ~155 min, builds the cache).
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/jax-compile-cache
          key: jax-compile-${{ hashFiles('uv.lock') }}-py3.13-ubuntu-24.04-${{ github.run_id }}
          restore-keys: |
            jax-compile-${{ hashFiles('uv.lock') }}-py3.13-ubuntu-24.04-
            jax-compile-

      - name: Install bench-perf deps (from locked uv.lock)
        # DO NOT call uv update — use the checked-in lockfile exactly.
        # blackjax@main is installed explicitly below to track HEAD.
        run: uv sync --group bench-perf --python 3.13

      - name: Install blackjax@main (explicit, on top of lockfile)
        run: |
          uv pip install "git+https://github.com/blackjax-devs/blackjax@main" --python 3.13
          uv run --python 3.13 python -c "import blackjax; print('blackjax version:', blackjax.__version__)"

      - name: Verify Python version
        run: |
          uv run --python 3.13 python --version
          uv run --python 3.13 python -c "import sys; assert sys.version_info[:2] == (3, 13), f'Expected Python 3.13, got {sys.version}'"

      - name: Compute nightly seeds (informational)
        id: seeds
        # Seeds are derived inside run_nightly.py; this step is informational only.
        run: JAX_PLATFORM_NAME=cpu uv run --python 3.13 python -m benchmarks.run_nightly --print-seeds

      - name: Select benchmark suite
        id: suite
        run: |
          if [ "${{ inputs.suite }}" = "fast" ]; then
            echo "files=benchmarks/test_fast_recipes.py" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.suite }}" = "e2e" ]; then
            echo "files=benchmarks/test_e2e_recipes.py" >> "$GITHUB_OUTPUT"
          else
            echo "files=benchmarks/test_fast_recipes.py benchmarks/test_e2e_recipes.py" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks (3 seeds inside each cell)
        id: bench
        run: |
          # set -o pipefail: propagate pytest's exit code through "| tee" so a
          # pytest crash (bad arg, import error, zero cells) fails THIS step, not
          # silently green-washes the job.
          set -o pipefail
          all_results_dir="benchmark_results_dir"
          mkdir -p "$all_results_dir"
          # Set output BEFORE pytest so it's available even if pytest fails.
          echo "all_results_dir=$all_results_dir" >> "$GITHUB_OUTPUT"

          # Note: --timeout requires pytest-timeout (not in bench-perf deps).
          # Job-level timeout-minutes: 180 covers runaway cells.
          # JAX_COMPILATION_CACHE_DIR: persists XLA compiled artifacts to disk so
          # clear_caches() (between cells, prevents OOM) doesn't force a cold recompile.
          # JAX's persistent cache is NOT cleared by jax.clear_caches() — each cell's
          # Step 1 compile-warmup loads from disk starting night 2.
          #
          # JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=0: required for CPU workloads.
          # JAX's default (1.0s) gates out all CPU XLA compilations (typically 50–200ms)
          # → cache stays empty → every night cold-compiles → 180-min timeout.
          # Set to 0 so ALL compilations are written.  Belt-and-suspenders with the
          # jax.config.update() in benchmarks/conftest.py (which catches local runs too).
          JAX_PLATFORM_NAME=cpu \
          JAX_COMPILATION_CACHE_DIR="${{ runner.temp }}/jax-compile-cache" \
          JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=0 \
          uv run --python 3.13 pytest ${{ steps.suite.outputs.files }} \
            -m benchmark \
            --benchmark-json="${all_results_dir}/bench_results.json" \
            --benchmark-disable-gc \
            --benchmark-warmup=off \
            --benchmark-min-rounds=1 \
            --benchmark-max-time=0 \
            -v \
            --tb=short \
            2>&1 | tee "${all_results_dir}/bench.log"

      - name: Store results + run regression check (nightly only)
        id: regression
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAX_PLATFORM_NAME=cpu uv run --python 3.13 python -m benchmarks.run_nightly \
            --results-dir "${{ steps.bench.outputs.all_results_dir }}"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v5  # v5 uses Node 22 (v4 deprecated June 2025)
        with:
          name: benchmark-results-${{ github.sha }}
          path: ${{ steps.bench.outputs.all_results_dir }}
          retention-days: 90

      - name: Save JAX persistent compilation cache
        # Always save — even when the benchmark or regression step fails — so the
        # next night starts with a warm compile cache rather than the cold stale
        # blob from 2026-06-04.
        #
        # Key uses github.run_id so each nightly writes a UNIQUE entry (avoids
        # the cache-hit no-op that would skip the save on a key collision).
        # restore-keys in the Restore step above picks up the most-recent matching
        # entry via prefix fallback — exact key first, then hash-prefix, then bare
        # prefix — so the next night always inherits the freshest available cache.
        #
        # Mirrors the pattern speed_benchmark.yml uses for its trend cache
        # (restore@v4 + save@v4 with if: always()).
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/jax-compile-cache
          key: jax-compile-${{ hashFiles('uv.lock') }}-py3.13-ubuntu-24.04-${{ github.run_id }}

      - name: Verify nightly cron fired (informational)
        if: github.event_name == 'schedule'
        run: |
          echo "Nightly cron fired at: $(date -u)"
          echo "Event: ${{ github.event_name }}"
          echo "SHA: ${{ github.sha }}"
