name: Recipe benchmark suite

# Nightly: full Tier 1+2, e2e + calibrated, 12 sampler families.
# Manual:  workflow_dispatch for on-demand runs (tier-selectable: tier1/tier2/all).
# No per-PR trigger: the suite grows to ~2h; nightly + on-demand is the right model.
#
# Working-directory note: the checkout IS the tuningfork repo root, so all steps
# run from the root (no working-directory override). benchmarks/ and pyproject.toml
# are both at the repo root.

on:
  schedule:
    # Nightly at 02:00 UTC (off-peak; avoids contention with other CI)
    - cron: '0 2 * * *'
  # pull_request trigger intentionally omitted: the suite will grow to ~2h
  # (Tier 1+2 nightly), making per-PR CI untenable. Nightly + on-demand is
  # the right model — use workflow_dispatch for targeted pre-merge validation.
  workflow_dispatch:
    inputs:
      tiers:
        description: 'Which tiers to run (tier1, tier2, or all)'
        required: false
        default: 'all'

jobs:
  benchmark:
    name: Benchmark (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60   # hard cap: prevents hung CI slots

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          # python-version hint alone is not sufficient — uv resolves "highest
          # satisfying requires-python>=3.13" and picks 3.14 when available.
          # The authoritative pin is .python-version (committed to the repo) +
          # --python 3.13 on every uv invocation below. See: jaxlib crashes on
          # 3.14 with Fatal Python error: Aborted (exit 134).
          python-version: "3.13"

      - name: Install bench-perf deps
        # --python 3.13 forces uv to use 3.13 regardless of available interpreters.
        # .python-version in the repo root provides the same pin for local runs.
        run: uv sync --group bench-perf --python 3.13

      - name: Verify Python version
        # Fails the workflow if jax imports on the wrong Python (prevents silent 3.14 drift).
        run: |
          uv run --python 3.13 python --version
          uv run --python 3.13 python -c "import sys; assert sys.version_info[:2] == (3, 13), f'Expected Python 3.13, got {sys.version}'"

      - name: Select benchmark filter
        id: filter
        run: |
          if [ "${{ inputs.tiers }}" = "tier1" ]; then
            echo "filter=-k 'tier1'" >> "$GITHUB_OUTPUT"
            echo "group=manual-tier1" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.tiers }}" = "tier2" ]; then
            echo "filter=-k 'tier2'" >> "$GITHUB_OUTPUT"
            echo "group=manual-tier2" >> "$GITHUB_OUTPUT"
          else
            # Nightly / manual 'all' (default): full Tier 1 + Tier 2
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "group=nightly-all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks
        # No working-directory: benchmarks/ is at the repo root.
        run: |
          JAX_PLATFORM_NAME=cpu uv run --python 3.13 pytest benchmarks/ \
            -m benchmark \
            ${{ steps.filter.outputs.filter }} \
            --benchmark-json=benchmark_results.json \
            --benchmark-disable-gc \
            --benchmark-warmup=on \
            --benchmark-warmup-iterations=1 \
            --benchmark-min-rounds=1 \
            --benchmark-max-time=240 \
            -v

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}-${{ steps.filter.outputs.group }}
          # benchmark_results.json is written to the repo root (no working-directory).
          path: benchmark_results.json
          retention-days: 90

      # Trend tracking: compare against the most recent stored result on main.
      # Only on nightly schedule (not manual dispatch) to keep the trend baseline clean.
      - name: Store + compare benchmark trend (nightly only)
        if: github.event_name == 'schedule'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "tuningfork recipe benchmarks"
          tool: "pytest"
          output-file-path: benchmark_results.json
          # Push results to gh-pages branch for the trend dashboard
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Alert when performance regresses > 20% vs the rolling mean
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: false   # non-blocking: alert but don't fail the workflow
