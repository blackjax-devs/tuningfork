name: Speed-lite benchmark

# Nightly 23:00 UTC, staggered 1h from seed-CI (correctness) at 22:00 UTC.
# Measures per-sampler-family wall-clock regression via rolling trend.
#
# Design:
#   SPEED_LITE_CELLS × 5 independent cold generated-program measurements.
#   Each measurement includes the receipt-backed execution lifecycle; no
#   cross-subprocess JIT cache is assumed.
#   Cell count owned by config.py (_SPEED_LITE_BENCH_IDS); this file is count-agnostic.
#   Fixed/pinned seed per dynamic cell (see PINNED_SEEDS in config.py) →
#   cross-run trend comparison valid without seed-induced trajectory variance.
#   Trend persisted in actions/cache (not gh-pages — sidesteps the gh-pages
#   permission issue that blocked our first attempt).
#   Alert threshold: 200% — fail-on-alert: true (nightly red = regression signal).
#
# Runtime: about 20 minutes observed on CI (13 cells × 5 cold measurements).
# Timeout: 90 min (generous headroom for slow CI runners).

on:
  schedule:
    # 23:00 UTC nightly; staggered 1h from seed-CI cron at 22:00 UTC to avoid
    # queue burst.  GH scheduled runs typically fire 2.5-5h late on congested
    # days — 23:00 + 5h + 1.5h run = 05:30 UTC worst case (fine).
    - cron: '0 23 * * *'
  workflow_dispatch:   # manual trigger for tuning / verification (no inputs needed)

permissions:
  contents: read

jobs:
  speed-lite:
    name: Speed-lite benchmark
    runs-on: ubuntu-24.04   # pinned LTS — env-consistent baselines
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5  # Node 22

      - name: Restore benchmark trend cache
        # Restores the most recent benchmark-data.json so the action can
        # compare today's run against the rolling trend.
        uses: actions/cache/restore@v4
        with:
          path: ./cache
          # Unique key ensures save always writes (avoids cache-hit no-op).
          # restore-keys picks up the most recent run on this OS.
          key: speed-benchmark-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            speed-benchmark-v2-${{ runner.os }}-

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install bench-perf deps (from locked uv.lock)
        # --frozen: refuse to re-resolve; install exactly what uv.lock pins.
        # See benchmark.yml for the full rationale (2026-06-22/23 probdiffeq incident).
        run: uv sync --frozen --group bench-perf --python 3.13

      - name: Install blackjax@main (explicit, on top of lockfile)
        # Track HEAD so speed regressions from blackjax changes surface nightly.
        # --no-deps: blackjax's transitive deps are already pinned in uv.lock
        # (frozen above); without this flag uv pip would re-resolve them.
        # Defense-in-depth on top of --frozen.  See benchmark.yml for details.
        run: |
          uv pip install --no-deps "git+https://github.com/blackjax-devs/blackjax@main" --python 3.13
          uv run --python 3.13 python -c "import blackjax; print('blackjax:', blackjax.__version__)"

      - name: Run speed-lite benchmarks (5 cold rounds each)
        # pedantic(warmup_rounds=0, rounds=5): each measurement launches an
        # independent generated program, so a discarded parent-process warmup
        # cannot warm the measured child process.
        # clear_xla_caches_between_cells fixture frees XLA cache after each cell.
        run: |
          mkdir -p benchmark_results_dir
          JAX_PLATFORM_NAME=cpu uv run --python 3.13 pytest benchmarks/test_speed_lite.py \
            -m benchmark \
            --benchmark-only \
            --benchmark-json=benchmark_results_dir/speed_output.json \
            --benchmark-disable-gc \
            -v \
            --tb=short

      - name: Store and compare benchmark trend
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: pytest
          output-file-path: benchmark_results_dir/speed_output.json
          # external-data-json-path + save-data-file: rolling trend via cache.
          # The action reads the file, appends the new run, and writes it back.
          external-data-json-path: ./cache/benchmark-data.json
          save-data-file: true
          alert-threshold: '200%'
          # fail-on-alert: true — nightly red job is the only reliable regression
          # signal (no PR to comment on under schedule).  200% threshold is
          # provisional; occasional false-positive red nights are expected and
          # acceptable until a few weeks of data establish the noise floor.
          fail-on-alert: true
          comment-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Emit speed-lite summary
        # Always emit a step summary so the "why did this go red?" answer is
        # self-contained without clicking into logs.
        if: always()
        run: |
          echo "## Speed-lite benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**SHA:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Alert threshold:** 200% — \`fail-on-alert: true\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See the *Store and compare benchmark trend* step output and the \`speed-benchmark-*\` artifact for per-cell timings and trend data." >> "$GITHUB_STEP_SUMMARY"

      - name: Save benchmark trend cache
        # Always save, even if the benchmark or alert step fails, so the next
        # run has a baseline to compare against.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./cache
          key: speed-benchmark-v2-${{ runner.os }}-${{ github.run_id }}

      - name: Upload benchmark results artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: speed-benchmark-${{ github.sha }}
          path: benchmark_results_dir/
          retention-days: 30
