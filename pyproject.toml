[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tuningfork"
authors = [{name = "The Blackjax team"}]
description = "Reproducible reference catalog + methodology exemplar for BlackJAX MCMC/VI/SMC algorithms — certified reference draws, calibrated hyperparameter recipes, and auto-gate verdicts across a curated 14-model suite."
requires-python = ">=3.13"
dependencies = [
    # JAX is CAPPED to a single minor: the benchmark catalog's certified
    # ground truth is numerically sensitive to JAX version (a 0.10.0→0.10.1
    # patch bump shifted window_adaptation step_size ~16% via chaotic warmup
    # amplification — issue #232). An uncapped JAX core means any `uv lock`
    # refresh can silently invalidate the catalog. Cap to <0.12 so a MINOR
    # bump is a deliberate, reviewed re-cert event; the lockfile pins the
    # exact patch for reproducibility, and benchmarks/_benchmark_helpers.py
    # emits ::warning::JAX_VERSION_MISMATCH when a recipe's cert JAX differs
    # from the running JAX.
    "jax>=0.11,<0.12",
    "jaxlib>=0.11,<0.12",
    "numpy",
    "pandas",
    "jax-tap>=0.3.0",  # Emission library for diagnostics (treedepth tripwire, y-taps, cert-pipeline taps); github.com/arcueil/jax-tap
]
dynamic = ["version"]

[project.optional-dependencies]
# Install tuningfork[viz] to enable catalog diagnostic plots, InferenceData
# helpers, and the marimo catalog explorer.  The core library (including all
# calibration and gate logic) does not require arviz.
viz = [
    "arviz",
    "arviz-plots>=0.6",
    "matplotlib",
]

# The `bench` group is the canonical install for running benchmarks.
# Mirrors sampling-book's `book` group so model implementations port cleanly,
# plus optuna (hyperparameter optimization) and posteriordb (reference cross-validation for shared models).
[dependency-groups]
# Interactive marimo notebook deps. Includes the full `bench` group because
# the catalog explorer imports numpyro (via tuningfork.model._numpyro),
# arviz, and matplotlib transitively. `uv sync --group notebook` installs
# everything needed for `marimo edit tuningfork/catalog/notebooks/catalog_explorer.py`.
notebook = [
    "marimo>=0.10",
    {include-group = "bench"},
]

bench = [
    # [progress] extra pulls in tqdm>=4.66, required by blackjax.progress_bar()'s
    # display thread (blackjax #964) -- emitted recipe scripts wrap their
    # warmup/sampling calls in this context manager when warmup_progress_bar=True.
    # 1.6.1 is the first PyPI release with ess_bulk / ess_tail / pareto_khat
    # (PR #994) + rank-normalised split-R̂ (PR #995) in blackjax.diagnostics.
    "blackjax[progress]>=1.6.1",
    "aeppl",
    "aesara",
    "arviz",
    "datasets",
    "diffeqzoo",
    "flax",
    "ipython",
    "jupyter-cache",
    "jupyter-book>=2",
    "jupytext",
    "matplotlib",
    "numpy",
    "numpyro",
    "optax",
    "pandas",
    "probdiffeq>=0.9.0",  # ported to 0.9 API; stop_gradient(u_std) fixes NaN autodiff
    "scikit-learn",
    "seaborn",
    "tfp-nightly[jax]",
    # tuningfork-specific additions
    "optuna",                   # Bayesian optimization over hyperparameters
    "posteriordb",              # Reference cross-validation for Eight Schools, Radon, and IRT models
    "pytest",
    "pytest-cov",
    "pytest-xdist",             # parallel test execution; ~3-5x speedup
    "pre-commit",
    "jupyterlab>=4.5.7",
]

# Phase 8 benchmark harness.  Install separately to avoid benchmark deps
# in the default CI environment (`uv sync --group bench-perf`).
# Note: includes `bench` to satisfy recipe + model imports.
bench-perf = [
    {include-group = "bench"},
    "pytest-benchmark>=4.0",    # timing harness; --benchmark-json output
]

[project.urls]
homepage = "https://github.com/blackjax-devs/tuningfork"

[project.license]
text = "Apache-2.0"
files = ["LICENSE"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.scripts]
tuningfork = "tuningfork.cli:main"

[tool.setuptools]
platforms = ["Linux", "Mac OS-X", "Unix"]

[tool.setuptools.packages.find]
# Ship only the tuningfork package. Dev-internal directories are excluded from
# both package discovery and sdist via MANIFEST.in (see repo root).
include = ["tuningfork*"]
exclude = [
    "experiments",
    "experiments.*",
    "tests",
    "tests.*",
    "notebooks",
    "notebooks.*",
    "results",
    "results.*",
]

[tool.setuptools_scm]
write_to = "tuningfork/_version.py"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # When all benchmark cells error at fixture setup, pytest-benchmark fires
    # "Not saving anything, no benchmarks have been run!" via PytestBenchmarkWarning
    # (a subclass of PytestWarning).  With filterwarnings=error this crashes
    # sessionfinish BEFORE pytest prints the per-cell ERRORS tracebacks — making
    # the root cause invisible in CI logs (2026-06-22 masking incident).
    # Ignoring this specific warning lets pytest reach the ERRORS section so the
    # actual fixture exception is visible.
    "ignore:.*no benchmarks have been run.*:pytest.PytestWarning",
]
