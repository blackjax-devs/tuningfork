[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tuningfork"
authors = [{name = "The Blackjax team"}]
description = "Reproducible reference catalog + methodology exemplar for BlackJAX MCMC/VI/SMC algorithms — certified reference draws, calibrated hyperparameter recipes, and auto-gate verdicts across a curated 14-model suite."
requires-python = ">=3.13"
dependencies = [
    "jax",
    "jaxlib",
    "numpy",
    "pandas",
]
dynamic = ["version"]

# The `bench` group is the canonical install for running benchmarks.
# Mirrors sampling-book's `book` group so model implementations port cleanly,
# plus optuna (hyperparameter optimization) and posteriordb (reference cross-validation for shared models).
[dependency-groups]
# Interactive marimo notebook deps. Includes the full `bench` group because
# the catalog explorer imports numpyro (via tuningfork.model._numpyro),
# arviz, and matplotlib transitively. `uv sync --group notebook` installs
# everything needed for `marimo edit tuningfork/catalog/notebooks/catalog_explorer.py`.
notebook = [
    "marimo>=0.10",
    {include-group = "bench"},
]

bench = [
    "blackjax @ git+https://github.com/blackjax-devs/blackjax.git@main",
    "aeppl",
    "aesara",
    "arviz",
    "datasets",
    "diffeqzoo",
    "fastprogress",
    "flax",
    "ipython",
    "jupyter-cache",
    "jupyter-book>=2",
    "jupytext",
    "matplotlib",
    "numpy",
    "numpyro",
    "optax",
    "pandas",
    "probdiffeq",
    "scikit-learn",
    "seaborn",
    "tfp-nightly[jax]",
    # tuningfork-specific additions
    "optuna",                   # Bayesian optimization over hyperparameters
    "posteriordb",              # Reference cross-validation for Eight Schools, Radon, and IRT models
    "pytest",
    "pytest-cov",
    "pytest-xdist",             # parallel test execution; ~3-5x speedup
    "pre-commit",
    "jupyterlab>=4.5.7",
]

# Phase 8 benchmark harness.  Install separately to avoid benchmark deps
# in the default CI environment (`uv sync --group bench-perf`).
# Note: includes `bench` to satisfy recipe + model imports.
bench-perf = [
    {include-group = "bench"},
    "pytest-benchmark>=4.0",    # timing harness; --benchmark-json output
]

[project.urls]
homepage = "https://github.com/blackjax-devs/tuningfork"

[project.license]
text = "Apache-2.0"
files = ["LICENSE"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.scripts]
tuningfork = "tuningfork.cli:main"

[tool.setuptools]
platforms = ["Linux", "Mac OS-X", "Unix"]

[tool.setuptools.packages.find]
# Ship only the tuningfork package. Dev-internal directories are excluded from
# both package discovery and sdist via MANIFEST.in (see repo root).
include = ["tuningfork*"]
exclude = [
    "experiments",
    "experiments.*",
    "tests",
    "tests.*",
    "notebooks",
    "notebooks.*",
    "results",
    "results.*",
]

[tool.setuptools_scm]
write_to = "tuningfork/_version.py"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
filterwarnings = ["error"]
