# Lint stack for tuningfork. ruff (ruff-check + ruff-format) replaces
# isort/pyupgrade/flake8/black/nbQA — one tool, one config, native Jupyter
# notebook support if any .ipynb ever lands. Tools kept identical in spirit
# to sampling-book/blackjax for cross-repo consistency.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: debug-statements
    - id: end-of-file-fixer
    - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format
      # ruff-format's hook default also formats fenced code blocks in
      # markdown (types_or includes "markdown"); the old stack
      # (black/isort/flake8/nbQA) never touched .md prose docs, only .py
      # and .ipynb. Keep that scope so curated doc formatting (aligned
      # inline comments in catalog READMEs/schemas) isn't rewritten as a
      # side effect of this migration.
      types_or: [python, pyi, jupyter]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.0
  hooks:
    - id: mypy
      args: [--ignore-missing-imports]
      exclude: '^scripts/'
- repo: https://github.com/jorisroovers/gitlint
  rev: v0.19.1
  hooks:
    - id: gitlint
    - id: gitlint-ci
- repo: local
  hooks:
    - id: no-internal-refs
      name: no internal agent-config references
      language: script
      entry: tools/check_no_internal_refs.sh
      pass_filenames: false
      always_run: true
