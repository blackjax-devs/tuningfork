# Lint stack for bjx-bench. Versions bumped from sampling-book's 2022-era pins
# so they install cleanly on Python 3.13. Tools and ignore lists kept identical
# in spirit to sampling-book/blackjax for cross-repo consistency.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-merge-conflict
    - id: debug-statements
    - id: end-of-file-fixer
    - id: trailing-whitespace
- repo: https://github.com/PyCQA/isort
  rev: 5.13.2
  hooks:
    - id: isort
      args: [--profile, black]
- repo: https://github.com/asottile/pyupgrade
  rev: v3.19.0
  hooks:
    - id: pyupgrade
      args: [--py311-plus]
- repo: https://github.com/PyCQA/flake8
  rev: 7.1.1
  hooks:
    - id: flake8
      args: ['--ignore=E501,E203,E731,W503']
- repo: https://github.com/psf/black
  rev: 24.10.0
  hooks:
    - id: black
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.13.0
  hooks:
    - id: mypy
      args: [--ignore-missing-imports]
- repo: https://github.com/nbQA-dev/nbQA
  rev: 1.9.0
  hooks:
    - id: nbqa-black
    - id: nbqa-pyupgrade
      args: [--py311-plus]
    - id: nbqa-isort
      args: ['--profile=black']
    - id: nbqa-flake8
      args: ['--ignore=E501,E203,E302,E402,E731,W503']
- repo: https://github.com/jorisroovers/gitlint
  rev: v0.19.1
  hooks:
    - id: gitlint
    - id: gitlint-ci
